<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" role="img" aria-label="Tiltakene velges etter risikovurderingen, ikke før" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<title>Tiltakene velges etter risikovurderingen, ikke før</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="347" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Tiltakene velges etter risikovurderingen, ikke før</text>
<g fill="none" stroke="#8c959f" stroke-width="1.25">
<path d="M184 104H204" marker-end="url(#arrow)"/>
<path d="M364 104H384" marker-end="url(#arrow)"/>
<path d="M544 104H564" marker-end="url(#arrow)"/>
<path d="M644 144V192" marker-end="url(#arrow)"/>
<path d="M564 232H544" marker-end="url(#arrow)"/>
<path d="M384 232H364" marker-end="url(#arrow)"/>
</g>
<rect x="24" y="64" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="40" y="88" font-size="13" font-weight="600" fill="#1f2328">1 Avgrens</text>
<text x="40" y="104" font-size="11.5" font-weight="400" fill="#57606a">Bestem hva systemet</text>
<text x="40" y="120" font-size="11.5" font-weight="400" fill="#57606a">skal dekke</text>
<rect x="204" y="64" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="220" y="88" font-size="13" font-weight="600" fill="#1f2328">2 Kartlegg</text>
<text x="220" y="104" font-size="11.5" font-weight="400" fill="#57606a">Finn AI-systemene</text>
<text x="220" y="120" font-size="11.5" font-weight="400" fill="#57606a">og hvem de berører</text>
<rect x="384" y="64" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="400" y="88" font-size="13" font-weight="600" fill="#1f2328">3 Vurder</text>
<text x="400" y="104" font-size="11.5" font-weight="400" fill="#57606a">Risiko og konsekvens</text>
<text x="400" y="120" font-size="11.5" font-weight="400" fill="#57606a">for hvert system</text>
<rect x="564" y="64" width="160" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="580" y="88" font-size="13" font-weight="600" fill="#1f2328">4 Velg tiltak</text>
<text x="580" y="104" font-size="11.5" font-weight="400" fill="#57606a">Fra Annex A, og</text>
<text x="580" y="120" font-size="11.5" font-weight="400" fill="#57606a">begrunn utelatelser</text>
<rect x="564" y="192" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="580" y="216" font-size="13" font-weight="600" fill="#1f2328">5 Innfør</text>
<text x="580" y="232" font-size="11.5" font-weight="400" fill="#57606a">Gjør tiltakene til</text>
<text x="580" y="248" font-size="11.5" font-weight="400" fill="#57606a">praksis, samle bevis</text>
<rect x="384" y="192" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="400" y="216" font-size="13" font-weight="600" fill="#1f2328">6 Revider internt</text>
<text x="400" y="232" font-size="11.5" font-weight="400" fill="#57606a">Sjekk at det virker</text>
<text x="400" y="248" font-size="11.5" font-weight="400" fill="#57606a">før sertifiseringen</text>
<rect x="204" y="192" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="220" y="216" font-size="13" font-weight="600" fill="#1f2328">7 Sertifisering</text>
<text x="220" y="232" font-size="11.5" font-weight="400" fill="#57606a">Uavhengig organ</text>
<text x="220" y="248" font-size="11.5" font-weight="400" fill="#57606a">reviderer systemet</text>
<text x="24" y="304" font-size="11.5" font-weight="400" fill="#57606a">Steg 4 er uthevet: tiltakene velges først når risiko og konsekvenser er vurdert.</text>
<text x="24" y="324" font-size="11.5" font-weight="400" fill="#57606a">Typisk tar veien fra start til sertifikat 6 til 12 måneder.</text>
</svg>
