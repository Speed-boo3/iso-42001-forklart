<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" role="img" aria-label="Kapitlene styrer valget av tiltak, og valget dokumenteres" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<title>Kapitlene styrer valget av tiltak, og valget dokumenteres</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="303" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Kapitlene styrer valget av tiltak, og valget dokumenteres</text>
<g fill="none" stroke="#8c959f" stroke-width="1.25">
<path d="M304 128H456" marker-end="url(#arrow)"/>
<path d="M164 160V200" marker-end="url(#arrow)"/>
<path d="M596 200V160" marker-end="url(#arrow)"/>
</g>
<rect x="24" y="64" width="280" height="96" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="40" y="88" font-size="13" font-weight="600" fill="#1f2328">Kapittel 4 til 10</text>
<text x="40" y="104" font-size="11.5" font-weight="400" fill="#57606a">Kravene til styringssystemet.</text>
<text x="40" y="120" font-size="11.5" font-weight="400" fill="#57606a">De er obligatoriske og har</text>
<text x="40" y="136" font-size="11.5" font-weight="400" fill="#57606a">samme oppbygging som ISO 27001.</text>
<rect x="456" y="64" width="280" height="96" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="472" y="88" font-size="13" font-weight="600" fill="#1f2328">Annex A</text>
<text x="472" y="104" font-size="11.5" font-weight="400" fill="#57606a">38 tiltak i 9 områder.</text>
<text x="472" y="120" font-size="11.5" font-weight="400" fill="#57606a">Man velger ut fra risiko, og</text>
<text x="472" y="136" font-size="11.5" font-weight="400" fill="#57606a">må begrunne det man utelater.</text>
<rect x="24" y="200" width="280" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="40" y="224" font-size="13" font-weight="600" fill="#1f2328">Statement of Applicability (SoA)</text>
<text x="40" y="240" font-size="11.5" font-weight="400" fill="#57606a">Her står hvilke tiltak som</text>
<text x="40" y="256" font-size="11.5" font-weight="400" fill="#57606a">gjelder, og hvorfor.</text>
<rect x="456" y="200" width="280" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="472" y="224" font-size="13" font-weight="600" fill="#1f2328">Annex B</text>
<text x="472" y="240" font-size="11.5" font-weight="400" fill="#57606a">Veiledning i hvordan tiltakene</text>
<text x="472" y="256" font-size="11.5" font-weight="400" fill="#57606a">kan gjøres til praksis.</text>
<text x="380" y="102" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">risikovurdering</text>
<text x="380" y="116" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">avgjør valget</text>
<text x="176" y="184" font-size="11.5" font-weight="400" fill="#57606a">valget skrives ned</text>
<text x="584" y="184" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="end">hjelper i praksis</text>
</svg>
