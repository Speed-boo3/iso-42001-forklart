<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-label="Styringssystemet er en sirkel som går om igjen" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<title>Styringssystemet er en sirkel som går om igjen</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="323" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Styringssystemet er en sirkel som går om igjen</text>
<g fill="none" stroke="#8c959f" stroke-width="1.25">
<path d="M184 104H204" marker-end="url(#arrow)"/>
<path d="M364 104H384" marker-end="url(#arrow)"/>
<path d="M544 104H564" marker-end="url(#arrow)"/>
<path d="M644 144V192" marker-end="url(#arrow)"/>
<path d="M564 232H544" marker-end="url(#arrow)"/>
<path d="M384 232H364" marker-end="url(#arrow)"/>
<path d="M204 232H104V144" marker-end="url(#arrow)"/>
</g>
<rect x="24" y="64" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="40" y="88" font-size="13" font-weight="600" fill="#1f2328">4 Kontekst</text>
<text x="40" y="104" font-size="11.5" font-weight="400" fill="#57606a">Forstå organisasjonen</text>
<text x="40" y="120" font-size="11.5" font-weight="400" fill="#57606a">og hvordan AI brukes</text>
<rect x="204" y="64" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="220" y="88" font-size="13" font-weight="600" fill="#1f2328">5 Ledelse</text>
<text x="220" y="104" font-size="11.5" font-weight="400" fill="#57606a">Policy og ansvar hos</text>
<text x="220" y="120" font-size="11.5" font-weight="400" fill="#57606a">toppledelsen</text>
<rect x="384" y="64" width="160" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="400" y="88" font-size="13" font-weight="600" fill="#1f2328">6 Planlegging</text>
<text x="400" y="104" font-size="11.5" font-weight="400" fill="#57606a">Vurder risiko og</text>
<text x="400" y="120" font-size="11.5" font-weight="400" fill="#57606a">konsekvenser, lag mål</text>
<rect x="564" y="64" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="580" y="88" font-size="13" font-weight="600" fill="#1f2328">7 Støtte</text>
<text x="580" y="104" font-size="11.5" font-weight="400" fill="#57606a">Kompetanse, ressurser</text>
<text x="580" y="120" font-size="11.5" font-weight="400" fill="#57606a">og dokumentasjon</text>
<rect x="564" y="192" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="580" y="216" font-size="13" font-weight="600" fill="#1f2328">8 Drift</text>
<text x="580" y="232" font-size="11.5" font-weight="400" fill="#57606a">Gjennomfør planene:</text>
<text x="580" y="248" font-size="11.5" font-weight="400" fill="#57606a">AI-systemets levetid</text>
<rect x="384" y="192" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="400" y="216" font-size="13" font-weight="600" fill="#1f2328">9 Evaluering</text>
<text x="400" y="232" font-size="11.5" font-weight="400" fill="#57606a">Mål og revider,</text>
<text x="400" y="248" font-size="11.5" font-weight="400" fill="#57606a">ledelsen går gjennom</text>
<rect x="204" y="192" width="160" height="80" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="220" y="216" font-size="13" font-weight="600" fill="#1f2328">10 Forbedring</text>
<text x="220" y="232" font-size="11.5" font-weight="400" fill="#57606a">Rett opp avvik og</text>
<text x="220" y="248" font-size="11.5" font-weight="400" fill="#57606a">forbedre fortløpende</text>
<text x="112" y="184" font-size="11.5" font-weight="400" fill="#57606a">ny runde</text>
<text x="24" y="304" font-size="11.5" font-weight="400" fill="#57606a">Kapittel 6 er uthevet: her gjøres vurderingene som styrer valget av tiltak.</text>
</svg>
